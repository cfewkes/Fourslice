name: Release Builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }} - ${{ matrix.channel }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            channel: windows-x64
            artifact_pattern: "dist/*.zip"
          - os: ubuntu-22.04
            channel: linux-x64
            artifact_pattern: "dist/*.tar.gz"
          - os: macos-14
            channel: osx-arm64
            artifact_pattern: "dist/*.zip"
          - os: macos-13
            channel: osx-x64
            artifact_pattern: "dist/*.zip"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linux GUI / Qt Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libfontconfig1 \
            libdbus-1-3

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest pillow

      - name: Run Smoke Tests (Headless)
        run: |
          pytest tests/test_config.py tests/test_parser.py tests/test_stats.py tests/test_sprites.py

      - name: Build Application Package
        run: |
          python build_release.py

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Fourslice-${{ matrix.channel }}
          path: ${{ matrix.artifact_pattern }}

      - name: Push to itch.io via Butler
        if: env.BUTLER_API_KEY != ''
        uses: fasterthanlime/butler-publish@v1.3.0
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        with:
          pushed_dir: ${{ matrix.artifact_pattern }}
          user: cfewkes
          game: fourslice
          channel: ${{ matrix.channel }}
          version: ${{ github.ref_name }}
